---
# --------------------------------------------------------------------------
# T39 — roles/pm — base
# Creates the pm system user + rootless Docker, directory layout, sysctl
# tweak, builds the compose images, and brings the stack up via a systemd
# user unit (pm-compose.service) under the pm user.
# --------------------------------------------------------------------------

# ── 1. pm group and user ─────────────────────────────────────────────────

- name: Create pm group
  group:
    name: "{{ pm_group }}"
    system: true
    state: present

- name: Create pm system user
  user:
    name: "{{ pm_user }}"
    group: "{{ pm_group }}"
    # pm containers need the pm group; no interactive shell needed.
    shell: /usr/sbin/nologin
    system: true
    create_home: true
    home: /home/pm
    state: present

- name: Read passwd entry for pm user
  getent:
    database: passwd
    key: "{{ pm_user }}"

- name: Cache pm user UID
  set_fact:
    pm_user_uid: "{{ ansible_facts.getent_passwd[pm_user][1] }}"

# ── 2. subuid / subgid for rootless Docker ───────────────────────────────

- name: Allocate subuid range for pm user
  lineinfile:
    path: /etc/subuid
    line: "{{ pm_user }}:100000:65536"
    create: true

- name: Allocate subgid range for pm user
  lineinfile:
    path: /etc/subgid
    line: "{{ pm_user }}:100000:65536"
    create: true

# ── 3. Required packages ─────────────────────────────────────────────────

- name: Install rootless Docker prerequisites
  apt:
    name:
      - uidmap
      - dbus-user-session
      - curl
      - acl          # needed for become_user with nologin shell
    state: present

# ── 4. sysctl: allow binding to port 80+ without root ────────────────────
#    nginx inside the stack listens on :443; rootless Docker cannot bind
#    privileged ports by default.

- name: Set net.ipv4.ip_unprivileged_port_start
  sysctl:
    name: net.ipv4.ip_unprivileged_port_start
    value: "{{ pm_sysctl_unprivileged_port_start }}"
    sysctl_set: true
    state: present
    reload: true

# ── 5. /srv/pm directory tree ────────────────────────────────────────────
# Every path here is either bind-mounted into the pm container (see the
# `volumes:` block in app/compose.yaml) or named in pm-projectctl's
# DEFAULT_CONFIG. They must exist before the stack starts: Docker silently
# materialises a missing bind source as a root-owned directory otherwise.

- name: Create /srv/pm directory tree
  file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner | default(pm_user) }}"
    group: "{{ item.group | default(pm_group) }}"
    mode: "{{ item.mode | default('0750') }}"
  loop:
    # projectctl.sock lives here; root-owned so only root can (re)create it,
    # group pm so the pm container can connect. o+x — not o+r — because the
    # per-project runners execute out of /srv/pm/app and project users are
    # deliberately NOT in the pm group, so they need traversal and nothing
    # else. The sensitive children below stay 0750.
    - { path: /srv/pm, owner: root, group: "{{ pm_group }}", mode: "0751" }
    # One directory per project, each holding that project's runner socket.
    # pm-projectctl re-asserts root:pm 0755 on this; match it so the first
    # `create` is not a permission change.
    - { path: /srv/pm/runners, owner: root, group: "{{ pm_group }}", mode: "0755" }
    # pm-projectctl's state_dir — project metadata, root-owned, pm-readable.
    - { path: /srv/pm/projects, owner: root, group: "{{ pm_group }}", mode: "0750" }
    # PM_DATA_DIR. queue.ts writes run logs to <data>/logs and copies verify
    # artifacts to <data>/artifacts/<runId>; pm.sqlite3 lives here too.
    - { path: /srv/pm/data }
    - { path: /srv/pm/data/logs }
    - { path: /srv/pm/data/artifacts }

# ── 6. Deploy app source ─────────────────────────────────────────────────

- name: Create pm app destination directory
  file:
    path: "{{ pm_app_dest }}"
    state: directory
    owner: "{{ pm_user }}"
    group: "{{ pm_group }}"
    # World-readable: project users (pm-<name>, never members of the pm group)
    # exec the runner from {{ pm_app_dest }}/runner/dist. Contents are source
    # code and build output only — the one secret in the tree, auth/htpasswd,
    # gets its own mode in nginx_tls.yml.
    mode: "0755"

# --chown is not optional. `synchronize` runs rsync in archive mode, and -a
# preserves *numeric* uid/gid from the control node: every file — and the
# destination directory itself — lands owned by whatever uid ran ansible, not
# by pm. The next task in this role builds @pm/runner as the pm user, and pnpm
# writes its temp files into the workspace root, so it died with EACCES on
# /srv/pm/app before it read a single package. Fixing it here rather than with
# a recursive chown afterwards keeps the walk off node_modules, which rsync
# excludes but pnpm then populates with tens of thousands of files.
- name: Synchronise app/ source to {{ pm_app_dest }}
  synchronize:
    src: "{{ pm_app_src }}/"
    dest: "{{ pm_app_dest }}/"
    rsync_opts:
      - "--exclude=node_modules"
      - "--exclude=.git"
      - "--exclude=*/dist"
      - "--chown={{ pm_user }}:{{ pm_group }}"
    delete: false
  notify: restart pm compose

# rsync also carries the source directory's mode across, which is whatever the
# control node's checkout happens to be (0775 here). Re-assert the mode the
# permission model depends on: project users are not in the pm group and reach
# the runner tree through the world-execute bit alone.
- name: Re-assert mode on {{ pm_app_dest }} after sync
  file:
    path: "{{ pm_app_dest }}"
    state: directory
    owner: "{{ pm_user }}"
    group: "{{ pm_group }}"
    mode: "0755"

# ── 7. Enable linger so pm user services survive without a login session ──

- name: Enable linger for pm user
  command: loginctl enable-linger {{ pm_user }}
  changed_when: false

# ── 8. Rootless Docker for pm user ───────────────────────────────────────

- name: Download Docker rootless install script
  get_url:
    url: https://get.docker.com/rootless
    dest: /tmp/rootless-install-pm.sh
    mode: "0755"

- name: Run Docker rootless install for pm user
  become: true
  become_user: "{{ pm_user }}"
  shell: /tmp/rootless-install-pm.sh
  args:
    creates: "/home/{{ pm_user }}/bin/dockerd-rootless.sh"
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pm_user_uid }}"
    HOME: "/home/{{ pm_user }}"

- name: Ensure Docker CLI plugin directory exists for pm user
  become: true
  become_user: "{{ pm_user }}"
  file:
    path: "/home/{{ pm_user }}/.docker/cli-plugins"
    state: directory
    owner: "{{ pm_user }}"
    group: "{{ pm_group }}"
    mode: "0755"

- name: Install Docker Compose CLI plugin for pm user
  become: true
  become_user: "{{ pm_user }}"
  get_url:
    url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ docker_compose_arch_map.get(ansible_facts['architecture'], ansible_facts['architecture']) }}"
    dest: "/home/{{ pm_user }}/.docker/cli-plugins/docker-compose"
    mode: "0755"

# RootlessKit's default "builtin" port driver terminates the inbound TCP
# connection on the host and opens a fresh one into the container, so nginx saw
# the bridge gateway (172.18.0.1) as $remote_addr for *every* request. That
# quietly disabled the whole realip block in nginx.conf.j2: set_real_ip_from
# lists Cloudflare's ranges, none of which ever matched, so CF-Connecting-IP
# was never honoured and access logs recorded 172.18.0.1 for all traffic. The
# slirp4netns port driver preserves the original source address, which is what
# makes "trust CF-Connecting-IP only from Cloudflare" an enforceable statement
# rather than a comment.
- name: Ensure a systemd drop-in directory for the pm user's docker service
  file:
    path: "/home/{{ pm_user }}/.config/systemd/user/docker.service.d"
    state: directory
    owner: "{{ pm_user }}"
    group: "{{ pm_group }}"
    mode: "0755"

- name: Make rootless Docker preserve the client source address
  copy:
    dest: "/home/{{ pm_user }}/.config/systemd/user/docker.service.d/port-driver.conf"
    owner: "{{ pm_user }}"
    group: "{{ pm_group }}"
    mode: "0644"
    content: |
      # Managed by roles/pm — see the comment in tasks/base.yml §8.
      [Service]
      Environment=DOCKERD_ROOTLESS_ROOTLESSKIT_PORT_DRIVER=slirp4netns
  register: pm_docker_port_driver
  # Restarting the daemon takes its containers down with it, and
  # pm-compose.service is RemainAfterExit — it would still read `active` with
  # nothing running.
  notify: restart pm compose

- name: Reload the pm user's systemd manager after the drop-in
  become: true
  become_user: "{{ pm_user }}"
  systemd:
    daemon_reload: true
    scope: user
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pm_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ pm_user_uid }}/bus"
  when: pm_docker_port_driver.changed

- name: Enable and start rootless Docker user service for pm user
  become: true
  become_user: "{{ pm_user }}"
  systemd:
    name: docker
    scope: user
    state: "{{ 'restarted' if pm_docker_port_driver.changed else 'started' }}"
    enabled: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pm_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ pm_user_uid }}/bus"

- name: Load nf_tables kernel module for rootless Docker
  modprobe:
    name: nf_tables
    state: present

# ── 9. Build compose images ──────────────────────────────────────────────

- name: Build pm compose images
  become: true
  become_user: "{{ pm_user }}"
  command:
    cmd: >
      /home/{{ pm_user }}/bin/docker compose
      --project-name {{ pm_compose_project }}
      --file {{ pm_app_dest }}/compose.yaml
      build
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pm_user_uid }}"
    DOCKER_HOST: "unix:///run/user/{{ pm_user_uid }}/docker.sock"
    HOME: "/home/{{ pm_user }}"
    PATH: "/home/{{ pm_user }}/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  register: pm_compose_build
  changed_when: "'CACHED' not in pm_compose_build.stdout"

# ── 10. pm-compose systemd user unit ─────────────────────────────────────

- name: Ensure systemd user unit directory exists for pm user
  file:
    path: "/home/{{ pm_user }}/.config/systemd/user"
    state: directory
    owner: "{{ pm_user }}"
    group: "{{ pm_group }}"
    mode: "0755"

- name: Deploy pm-compose.service systemd user unit
  template:
    src: pm-compose.service.j2
    dest: "/home/{{ pm_user }}/.config/systemd/user/pm-compose.service"
    owner: "{{ pm_user }}"
    group: "{{ pm_group }}"
    mode: "0644"
  notify:
    - reload systemd daemon
    - restart pm compose

- name: Flush handlers to reload daemon before enabling unit
  meta: flush_handlers

- name: Enable and start pm-compose.service for pm user
  become: true
  become_user: "{{ pm_user }}"
  systemd:
    name: pm-compose.service
    scope: user
    state: started
    enabled: true
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ pm_user_uid }}"
    DBUS_SESSION_BUS_ADDRESS: "unix:path=/run/user/{{ pm_user_uid }}/bus"
