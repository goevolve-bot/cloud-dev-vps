---
# --------------------------------------------------------------------------
# T40 — roles/pm — nginx + TLS + auth
# Renders the nginx conf (from template with Cloudflare real_ip ranges),
# generates a self-signed origin cert into a named volume (idempotent), and
# writes the htpasswd file from a vaulted variable.
#
# Variable required in group_vars, vault-encrypted:
#   pm_auth_password  — password for the basic-auth user "pm"
#   pm_auth_user      — (optional, default "pm") basic-auth username
# There is deliberately no default for pm_auth_password anywhere in the repo;
# see the assert below.
# --------------------------------------------------------------------------

- name: Set pm_auth_user default
  set_fact:
    pm_auth_user: "{{ pm_auth_user | default('pm') }}"

# ── 1. nginx.conf ────────────────────────────────────────────────────────
# The compose stack bind-mounts nginx/nginx.conf from the app directory;
# we render the template directly into the deployed app tree so the next
# compose (re)start picks it up automatically.

- name: Render nginx.conf from template
  template:
    src: nginx.conf.j2
    dest: "{{ pm_app_dest }}/nginx/nginx.conf"
    owner: "{{ pm_user }}"
    group: "{{ pm_group }}"
    mode: "0644"
  notify: restart pm compose

# ── 2. self-signed origin cert ───────────────────────────────────────────
# The cert-init one-shot in compose.yaml already handles this at container
# startup (idempotent). We just make sure the certs volume exists so the
# one-shot can write to it. Nothing to do here beyond ensuring the stack
# is up (done by base.yml T39).

# ── 3. htpasswd ──────────────────────────────────────────────────────────
# {{ pm_app_dest }}/auth is bind-mounted straight into nginx as
# /etc/nginx/auth (app/compose.yaml), so the file written here is literally the
# one nginx reads. It used to land in the app tree while nginx read a *named
# volume* populated by the auth-init one-shot — so the vaulted password was
# generated and then ignored, and production ran on admin/changeme (review
# §5.3). auth-init still exists for local dev but only creates the file when it
# is absent, so it can no longer overwrite this one.

- name: Install apache2-utils for htpasswd
  apt:
    name: apache2-utils
    state: present

- name: Generate htpasswd file for pm auth
  become: true
  become_user: "{{ pm_user }}"
  # -B = bcrypt. Required, not cosmetic: the file has to be world-readable (see
  # the mode below), so the hash is the only thing protecting the password.
  command:
    argv:
      - htpasswd
      - -Bbc
      - /tmp/pm-htpasswd
      - "{{ pm_auth_user }}"
      - "{{ pm_auth_password }}"
  no_log: true
  changed_when: true

- name: Ensure auth directory exists in app tree
  file:
    path: "{{ pm_app_dest }}/auth"
    state: directory
    owner: "{{ pm_user }}"
    group: "{{ pm_group }}"
    mode: "0755"

- name: Install htpasswd where nginx reads it
  copy:
    src: /tmp/pm-htpasswd
    dest: "{{ pm_app_dest }}/auth/htpasswd"
    remote_src: true
    owner: "{{ pm_user }}"
    group: "{{ pm_group }}"
    # nginx parses auth_basic_user_file in its worker process, which the
    # official image runs as the unprivileged `nginx` user. Under rootless
    # Docker that uid maps into pm's subuid range — it is neither the file's
    # owner nor in its group — so 0600 would make nginx fail to authenticate
    # anyone. bcrypt above is what makes 0644 acceptable.
    mode: "0644"
  no_log: true
  notify: restart pm compose

- name: Remove temporary htpasswd file
  file:
    path: /tmp/pm-htpasswd
    state: absent
