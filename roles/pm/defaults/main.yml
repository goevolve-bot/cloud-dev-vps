---
# --------------------------------------------------------------------------
# roles/pm — defaults
# Override these in group_vars/all.yml or host_vars/ as needed.
# --------------------------------------------------------------------------

# User and group that own the PM stack
pm_user: pm
pm_group: pm

# Where pm-projectctl lands on the host
pm_projectctl_bin: /usr/local/sbin/pm-projectctl

# Where the app checkout lives (Ansible deploys from the control node).
# This has to be /srv/pm/app, not somewhere in /opt: pm-projectctl's
# DEFAULT_CONFIG execs the per-project runner as
# /usr/bin/node /srv/pm/app/runner/dist/index.js, and the runner resolves
# @pm/core through the pnpm node_modules tree that sits beside it. Moving the
# tree means overriding runner_exec in /etc/pm-projectctl.conf as well; keeping
# the default true is the cheaper contract.
pm_app_src: "{{ playbook_dir }}/app"
pm_app_dest: /srv/pm/app

# Compose project name (also used as the systemd unit name)
pm_compose_project: pm

# Listening port inside the compose network (nginx → pm container)
pm_backend_port: 3000

# sysctl: allow rootless Docker (and our nginx on :443) to bind low ports.
# 443 and not 80: the stack has no plaintext :80 listener by design, and every
# port below this value stays root-only. Lowering it to 80 would hand every
# unprivileged user on the box the ability to bind :80 for nothing in return.
pm_sysctl_unprivileged_port_start: 443

# Node runtime for the per-project runners. pm-projectctl renders a systemd
# unit whose ExecStart is literally /usr/bin/node and refuses to install a
# runner when that path is missing, so the host needs a system-wide Node — the
# nvm install in roles/dev_tools belongs to dev_user and is not on root's PATH.
# Kept on the same major as the server image (node:22-alpine).
pm_node_version: "22.14.0"
# Must be a pnpm major that reads lockfileVersion 9.0 (app/pnpm-lock.yaml),
# otherwise the --frozen-lockfile install of @pm/runner cannot verify anything.
#
# Keep in sync with `packageManager` in app/package.json. Both are needed and
# neither is redundant: `corepack prepare --activate` (runner.yml) only sets the
# *fallback* version, while Corepack's shim always prefers the project's own
# `packageManager` field — and when that field is absent it resolves whatever is
# latest on the registry and then writes the field back into package.json. On
# this host that write happens as the pm user against a root-synced tree, so the
# runner install died with EACCES on /srv/pm/app/package.json before it ever
# read the lockfile. The field also pins the pnpm used inside server/Dockerfile,
# which has the same `corepack enable` with no version of its own.
pm_pnpm_version: "10.11.0"
pm_node_arch_map:
  x86_64: x64
  aarch64: arm64
  arm64: arm64
  armv7l: armv7l

# Cloudflare IP ranges (fetched from https://www.cloudflare.com/ips-v4 and
# https://www.cloudflare.com/ips-v6, 2026). Used in both nftables (T42) and
# nginx real_ip_from (T40). Refresh these periodically.
cloudflare_ipv4_ranges:
  - 173.245.48.0/20
  - 103.21.244.0/22
  - 103.22.200.0/22
  - 103.31.4.0/22
  - 141.101.64.0/18
  - 108.162.192.0/18
  - 190.93.240.0/20
  - 188.114.96.0/20
  - 197.234.240.0/22
  - 198.41.128.0/17
  - 162.158.0.0/15
  - 104.16.0.0/13
  - 104.24.0.0/14
  - 172.64.0.0/13
  - 131.0.72.0/22

cloudflare_ipv6_ranges:
  - 2400:cb00::/32
  - 2606:4700::/32
  - 2803:f800::/32
  - 2405:b500::/32
  - 2405:8100::/32
  - 2a06:98c0::/29
  - 2c0f:f248::/32

# Whether to scope nftables rule 443 to Cloudflare ranges only (recommended
# for production; set false if you need direct access during troubleshooting).
pm_nftables_cloudflare_only: true

# Docker Compose version (re-uses the same default as dev_tools)
docker_compose_version: v2.39.1
docker_compose_arch_map:
  x86_64: x86_64
  aarch64: aarch64
  arm64: aarch64
  armv7l: armv7

# System-wide Docker for project users (roles/pm/tasks/docker_host.yml).
# Installed from the static archives, not Docker's apt repo: the apt package
# docker-ce-rootless-extras pulls in docker-ce, i.e. a rootful system daemon,
# which is precisely what this design keeps off the host.
pm_docker_version: "29.6.2"
# download.docker.com/linux/static/stable/<arch>/ — kernel arch names.
pm_docker_arch_map:
  x86_64: x86_64
  aarch64: aarch64
  arm64: aarch64
  armv7l: armhf

# Compose v2 delegates `build` to buildx; project verify environments are built
# by the project user, so the plugin has to be system-wide too.
pm_buildx_version: v0.35.0
# GitHub release assets use OCI arch names, which match neither of the maps
# above (x64 for Node, x86_64 for download.docker.com).
pm_oci_arch_map:
  x86_64: amd64
  aarch64: arm64
  arm64: arm64
  armv7l: arm-v7

# The agent image (app/agent-image/Dockerfile) that every run executes in.
# Built once as the pm user at deploy time and exported here; pm-projectctl
# loads it into each project's own rootless daemon at create time. Building it
# per project instead would re-download the whole toolchain for every project
# and move a multi-minute failure into the create-project modal.
pm_agent_image_tag: "pm-agent:latest"
pm_agent_image_dir: /srv/pm/images
