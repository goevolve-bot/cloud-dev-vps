# LOCAL DEV COPY. On a deployed host this file is overwritten by Ansible from
# roles/pm/templates/nginx.conf.j2 (T40), which is the authority: the ranges
# below and the proxy block must stay a faithful rendering of that template
# with roles/pm/defaults/main.yml's values. Change the template first.
#
# `location /` proxies everything to the pm container, which serves both /api
# and the built SPA (server/Dockerfile builds web/dist; app.ts serves it with
# an index.html fallback) — so a single upstream is correct here.
#
# Trust Cloudflare's edge: the origin is only ever reached through Cloudflare
# (Full strict — see docs/pm-system-plan.md), which always connects over
# HTTPS/443, so there is no plaintext :80 listener here at all. The realip
# module recovers the true client IP from the CF-Connecting-IP header, but
# only for connections that actually originate from a Cloudflare IP —
# set_real_ip_from is the trust list; without it, CF-Connecting-IP would be
# just another spoofable client-supplied header. Once trusted, nginx rewrites
# $remote_addr itself, so proxy_set_header X-Real-IP $remote_addr below (and
# access logs, rate limiting, etc.) all see the real visitor IP for free —
# that's preferred here over reading $http_cf_connecting_ip directly, which
# would bypass the trust check entirely.
#
# Ranges from https://www.cloudflare.com/ips/ (fetched 2026, stable but not
# guaranteed — re-verify at deploy time; T40 should template this list rather
# than hand-maintain it).
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/origin.crt;
    ssl_certificate_key /etc/nginx/certs/origin.key;

    auth_basic           "pm";
    auth_basic_user_file /etc/nginx/auth/htpasswd;

    # SSE-friendly: don't buffer responses, let events reach the client as
    # they're written (see /api/runs/:id/events in the eventual API, T20).
    proxy_buffering off;

    location / {
        proxy_pass http://pm:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
}
